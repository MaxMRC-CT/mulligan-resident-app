version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mulligan-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mulligan
      POSTGRES_PASSWORD: mulligan_dev_pass
      POSTGRES_DB: mulligan_resident_app
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
